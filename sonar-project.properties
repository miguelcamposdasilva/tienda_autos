# Configuración de análisis estático SonarQube - Automarket
sonar.projectKey=automarket
sonar.projectName=Automarket - Tienda de Autos
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Código fuente analizado (backend Express + frontend React)
sonar.sources=backend,frontend/src
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,frontend/public/**

# Pruebas unitarias
sonar.tests=backend/test,frontend/test
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Cobertura (generada con "npm run test:coverage" en backend y "npm test" en frontend)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
